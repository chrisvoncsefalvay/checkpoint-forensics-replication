[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "checkpoint-forensics-replication"
version = "0.1.0"
description = "Independent sparse Philox initialisation fingerprint replication"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.scripts]
checkpoint-forensics = "checkpoint_forensics.cli:main"
[tool.setuptools.packages.find]
include = ["checkpoint_forensics*"]
